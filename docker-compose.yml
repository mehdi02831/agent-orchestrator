services:
  postgres:
    image: postgres:16
    env_file: .env
    ports: ["${POSTGRES_PORT}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["${REDIS_PORT}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  chroma:
    image: chromadb/chroma:latest
    ports: ["${CHROMA_PORT}:8000"]
    volumes: ["chroma_data:/data"]
  api:
    build: .
    command: uvicorn agentlab.api.app:app --host 0.0.0.0 --port 8000
    ports: ["8010:8000"]
    environment: &app_env
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      RAG_API_URL: http://host.docker.internal:8000
      RAG_API_KEY: ${RAG_API_KEY:?set RAG_API_KEY in .env}
      ORCH_API_KEY: ${ORCH_API_KEY:?set ORCH_API_KEY in .env}
    volumes: ["./workspace:/app/workspace"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    command: celery -A agentlab.jobs.celery_app worker --loglevel=info --concurrency=1
    environment: *app_env
    volumes: ["./workspace:/app/workspace"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
volumes:
  pgdata:
  chroma_data:
